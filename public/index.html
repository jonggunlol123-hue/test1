<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골드문 | 조직 통합 관리 패널</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#101014;--panel:#19191f;--panel2:#202027;--gold:#d4af37;--gold2:#f3d978;--red:#741d2b;--muted:#a7a7b4;--line:#34343d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f7f5ee;font-family:Inter,"Noto Sans KR",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;transition:.15s}
button:disabled{opacity:.45;cursor:not-allowed}
.sidebar{background:#0b0b0e;border-right:1px solid #29252a}
.gold{color:var(--gold)}
.gold-btn{background:var(--gold);color:#17130a;font-weight:800}
.gold-btn:hover{background:var(--gold2)}
.outline-btn{border:1px solid #4a4650;background:#19191f;color:#eee}
.outline-btn:hover{border-color:var(--gold);color:var(--gold)}
.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:10px;color:#c4c1cb;text-align:left;font-weight:600}
.nav-btn:hover{background:#211a1e;color:#fff}
.nav-btn.active{background:linear-gradient(100deg,#671b29,#35171f);color:var(--gold2);box-shadow:inset 3px 0 var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px}
.muted{color:var(--muted)}
.field{width:100%;background:#101014;border:1px solid #41414b;border-radius:9px;padding:10px 12px;color:#fff;outline:none}
.field:focus{border-color:var(--gold);box-shadow:0 0 0 2px #d4af3722}
.field::placeholder{color:#777784}
.label{display:block;font-size:12px;color:#b9b6c0;margin-bottom:6px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:620px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#aaa6b1;text-align:left;background:#15151a}
th,td{padding:13px 15px;border-bottom:1px solid #303039}
td{font-size:13px}
tbody tr:hover{background:#ffffff05}
.badge{font-size:11px;padding:4px 8px;border-radius:99px;background:#2d2920;color:var(--gold2);border:1px solid #5b4a1e}
.danger{color:#ff8e99;background:#351a20;border:1px solid #6b2935}
.stat-number{font-size:27px;font-weight:800;letter-spacing:-.03em}
.hero{background:radial-gradient(circle at 90% 5%,#4d3a14 0,transparent 32%),linear-gradient(115deg,#26211a,#21151c 55%,#30151e);border:1px solid #514222;position:relative;overflow:hidden}
.hero:after{content:"☾";position:absolute;right:38px;top:-40px;font-size:200px;color:#d4af370d;pointer-events:none}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#25251d;border:1px solid var(--gold);padding:13px 17px;border-radius:10px;box-shadow:0 10px 35px #0008}
.modal-backdrop{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#1a1a20;border:1px solid #514222;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0009}
.hidden{display:none!important}
.mobile-top{display:none}
@media(max-width:800px){
.sidebar{position:fixed;z-index:30;left:-270px;top:0;bottom:0;width:250px;transition:left .2s}
.sidebar.open{left:0}
.mobile-top{display:flex}
.main-area{margin-left:0!important}
.stat-number{font-size:23px}
.hero:after{right:-15px;top:5px;font-size:130px}
.content-pad{padding:16px!important}
}
@media(min-width:801px){
.sidebar{width:250px;flex-shrink:0}
.main-area{margin-left:250px}
}
</style>
</head>
<body>

<div id="loginScreen" class="min-h-screen flex items-center justify-center p-4" style="background:radial-gradient(ellipse at top,#332714 0,#101014 52%)">
  <div class="panel w-full max-w-md p-7 sm:p-9">
    <div class="text-center mb-7">
      <div class="w-16 h-16 rounded-2xl mx-auto mb-4 flex items-center justify-center text-3xl" style="background:#2c2414;border:1px solid #8a7027">🌙</div>
      <h1 class="text-2xl font-extrabold">골드문 <span class="gold">Gold Moon</span></h1>
      <p class="muted text-sm mt-2">조직 통합 관리 패널</p>
    </div>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="label">조직원 / 관리자 아이디</label>
        <input class="field" id="loginUser" autocomplete="username" placeholder="아이디 입력" required>
      </div>
      <div>
        <label class="label">비밀번호</label>
        <input class="field" id="loginPass" type="password" autocomplete="current-password" placeholder="비밀번호 입력" required>
      </div>
      <button class="gold-btn w-full rounded-lg py-3 mt-2">로그인</button>
      <p id="loginError" class="text-sm text-red-300 hidden">아이디 또는 비밀번호를 확인해 주세요.</p>
    </form>
  </div>
</div>

<div id="app" class="hidden">
  <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 flex flex-col p-4">
    <div class="px-2 pt-2 pb-5 mb-4 border-b" style="border-color:#343039">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center text-xl" style="background:#2b2414;border:1px solid #6c5822">🌙</div>
        <div>
          <div class="font-extrabold text-lg">골드문 <span class="gold">Gold Moon</span></div>
          <div class="text-xs muted mt-1">조직 통합 관리 패널</div>
        </div>
      </div>
    </div>

    <nav id="nav" class="space-y-1 flex-1">
      <button class="nav-btn active" data-page="dashboard"><span>▦</span> 대시보드</button>
      <button class="nav-btn" data-page="members"><span>♟</span> 조직원 관리</button>
      <button class="nav-btn" data-page="ranks"><span>✦</span> 직급표</button>
      <button class="nav-btn" data-page="ledger"><span>▤</span> 장부 관리</button>
      <button class="nav-btn" data-page="items"><span>▧</span> 품목 관리</button>
      <button class="nav-btn admin-only" data-page="categories"><span>▦</span> 카테고리 관리</button>
      <button class="nav-btn" data-page="transactions"><span>◉</span> 거래내역 조회</button>
      <button class="nav-btn" data-page="loans"><span>↗</span> 대출 관리</button>
      <button class="nav-btn admin-only" data-page="viewers"><span>♙</span> 조회 계정 관리</button>
    </nav>

    <div class="rounded-xl p-3 mt-4" style="background:#18151a;border:1px solid #332b30">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full flex items-center justify-center gold" style="background:#332817">♛</div>
        <div class="min-w-0">
          <p class="text-sm font-bold truncate" id="sideName">조직 두목</p>
          <p class="text-xs gold" id="sideRole">최고 관리자</p>
        </div>
      </div>
    </div>
  </aside>

  <div class="main-area min-h-screen">
    <header class="h-[72px] sticky top-0 z-20 flex items-center justify-between px-5 sm:px-8" style="background:#121216ee;backdrop-filter:blur(14px);border-bottom:1px solid #302e35">
      <div class="flex items-center gap-3">
        <button id="menuToggle" class="mobile-top outline-btn rounded-lg px-3 py-2">☰</button>
        <div>
          <div id="pageTitle" class="font-bold">대시보드</div>
          <div class="muted text-xs mt-1 hidden sm:block">GOLD MOON • 조직 운영 시스템</div>
        </div>
      </div>
      <div class="flex gap-2">
        <button id="changePasswordBtn" class="outline-btn rounded-lg px-3 py-2 text-sm hidden sm:block">비밀번호 변경</button>
        <button id="logoutBtn" class="outline-btn rounded-lg px-3 py-2 text-sm">로그아웃</button>
        <button id="quickLedger" class="gold-btn rounded-lg px-3 py-2 text-sm">＋ 장부 작성</button>
      </div>
    </header>
    <main id="content" class="content-pad p-6 sm:p-8 max-w-[1500px] mx-auto"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

let data = {
  admin:{username:'',name:'조직 두목'},
  members:[],
  ranks:[],
  ledger:[],
  items:[],
  categories:['일반'],
  loans:[]
};

let currentPage = 'dashboard';
let currentRole = 'admin';
let saveQueue = Promise.resolve();

async function api(url, options = {}) {
  const response = await fetch(url, {
    credentials:'same-origin',
    headers:{'Content-Type':'application/json',...(options.headers||{})},
    ...options
  });
  const payload = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(payload.error || '요청을 처리하지 못했습니다.');
  return payload;
}

async function load() {
  data = await api('/api/data');
  data.categories = Array.isArray(data.categories) ? data.categories : [];
  data.items = Array.isArray(data.items) ? data.items : [];

  for (const item of data.items) {
    const category = (item.category || '일반').trim();
    if (category && !data.categories.includes(category)) {
      data.categories.push(category);
    }
  }

  if (!data.categories.length) data.categories = ['일반'];
}

function save() {
  if (currentRole !== 'admin') {
    toast('조회 전용 계정은 수정할 수 없습니다.');
    return Promise.resolve();
  }

  const snapshot = {
    members:data.members,
    ranks:data.ranks,
    ledger:data.ledger,
    items:data.items,
    categories:data.categories,
    loans:data.loans
  };

  saveQueue = saveQueue
    .then(() => api('/api/data', {
      method:'PUT',
      body:JSON.stringify(snapshot)
    }))
    .catch(error => toast(error.message || '저장에 실패했습니다.'));

  return saveQueue;
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[char]));
}

function won(number) {
  return Number(number || 0).toLocaleString('ko-KR') + '원';
}

function dateNow() {
  return new Date().toISOString().slice(0,10);
}

function toast(message) {
  $('#toastRoot').innerHTML = `<div class="toast text-sm">${esc(message)}</div>`;
  setTimeout(() => $('#toastRoot').innerHTML = '', 2600);
}

async function showApp() {
  try {
    const me = await api('/api/me');
    currentRole = me.role || 'admin';
    await load();

    $('#loginScreen').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#sideName').textContent = me.displayName || data.admin.name || '조직 두목';

    const roleLabel = $('#sideRole');
    if (roleLabel) {
      roleLabel.textContent = currentRole === 'admin' ? '최고 관리자' : '조회 전용 계정';
    }

    $$('.admin-only').forEach(element => {
      element.classList.toggle('hidden', currentRole !== 'admin');
    });

    $('#quickLedger').classList.toggle('hidden', currentRole !== 'admin');
    $('#changePasswordBtn').classList.toggle('hidden', currentRole !== 'admin');

    render();
  } catch (error) {
    showLogin();
    toast(error.message || '데이터를 불러오지 못했습니다.');
  }
}

function showLogin() {
  $('#app').classList.add('hidden');
  $('#loginScreen').classList.remove('hidden');
  $('#loginPass').value = '';
}

$('#loginForm').addEventListener('submit', async event => {
  event.preventDefault();
  const button = event.target.querySelector('button');
  button.disabled = true;

  try {
    await api('/api/login', {
      method:'POST',
      body:JSON.stringify({
        username:$('#loginUser').value.trim(),
        password:$('#loginPass').value
      })
    });
    $('#loginError').classList.add('hidden');
    await showApp();
  } catch (error) {
    $('#loginError').textContent = error.message || '아이디 또는 비밀번호를 확인해 주세요.';
    $('#loginError').classList.remove('hidden');
  } finally {
    button.disabled = false;
  }
});

$('#logoutBtn').onclick = async () => {
  try {
    await api('/api/logout', {method:'POST',body:'{}'});
  } finally {
    showLogin();
  }
};

$('#menuToggle').onclick = () => $('#sidebar').classList.toggle('open');

$('#nav').addEventListener('click', event => {
  const button = event.target.closest('[data-page]');
  if (button) go(button.dataset.page);
});

function go(page) {
  currentPage = page;
  $('#sidebar').classList.remove('open');
  render();
}

$('#quickLedger').onclick = () => {
  go('ledger');
  setTimeout(() => openLedgerModal(), 0);
};

$('#changePasswordBtn').onclick = () => openModal('비밀번호 변경', `
  <form id="passwordForm" class="space-y-3">
    <div><label class="label">현재 비밀번호</label><input class="field" name="old" type="password" required></div>
    <div><label class="label">새 비밀번호 (12자 이상)</label><input class="field" name="newp" type="password" minlength="12" required></div>
    <div><label class="label">새 비밀번호 확인</label><input class="field" name="confirm" type="password" minlength="12" required></div>
    <button class="gold-btn rounded-lg px-4 py-2 w-full">변경 저장</button>
  </form>
`);

function render() {
  const titles = {
    dashboard:'대시보드',
    members:'조직원 관리',
    ranks:'직급표',
    ledger:'장부 관리',
    items:'품목 관리',
    categories:'카테고리 관리',
    transactions:'거래내역 조회',
    loans:'대출 관리',
    viewers:'조회 계정 관리'
  };

  $('#pageTitle').textContent = titles[currentPage] || '골드문';
  $$('.nav-btn').forEach(button => {
    button.classList.toggle('active', button.dataset.page === currentPage);
  });

  const views = {
    dashboard:dashboardView,
    members:membersView,
    ranks:ranksView,
    ledger:ledgerView,
    items:itemsView,
    categories:categoriesView,
    transactions:transactionsView,
    loans:loansView,
    viewers:viewersView
  };

  $('#content').innerHTML = views[currentPage] ? views[currentPage]() : '';
  bindPage();

  if (currentPage === 'viewers') loadViewerList();
}

function viewersView() {
  return `
    <div class="panel p-5">
      <h2 class="text-xl font-extrabold mb-2">조회 계정 관리</h2>
      <p class="muted text-sm mb-5">조회 전용 계정은 데이터를 확인할 수 있지만 수정할 수 없습니다.</p>
      <form id="viewerCreateForm" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
        <div><label class="label">아이디 (3~50자)</label><input class="field" name="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_-]+" required></div>
        <div><label class="label">표시 이름</label><input class="field" name="displayName" maxlength="50" required></div>
        <div><label class="label">비밀번호 (12자 이상)</label><input class="field" name="password" type="password" minlength="12" required></div>
        <div class="flex items-end"><button class="gold-btn rounded-lg px-4 py-2 w-full">조회 계정 생성</button></div>
      </form>
      <div id="viewerList" class="muted text-sm">계정 목록을 불러오는 중...</div>
    </div>`;
}

async function loadViewerList() {
  const root = $('#viewerList');
  if (!root) return;

  try {
    const result = await api('/api/viewer-accounts');
    const accounts = result.accounts || result;

    root.innerHTML = Array.isArray(accounts) && accounts.length
      ? tableHTML(
          ['아이디','표시 이름','관리'],
          accounts.map(account => [
            esc(account.username),
            esc(account.displayName || account.display_name || ''),
            `<button class="outline-btn danger rounded px-2 py-1 text-xs" data-delete-viewer="${esc(account.id)}">삭제</button>`
          ])
        )
      : empty('등록된 조회 계정이 없습니다.');
  } catch (error) {
    root.textContent = error.message || '계정 목록을 불러오지 못했습니다.';
  }
}

function sectionHead(title, subtitle, button = '') {
  return `<div class="flex flex-wrap items-end justify-between gap-3 mb-5">
    <div><h2 class="text-xl font-extrabold">${title}</h2><p class="muted text-sm mt-1">${subtitle}</p></div>
    ${button}
  </div>`;
}

function empty(message) {
  return `<div class="text-center muted py-12">${message}</div>`;
}

function dashboardView() {
  const income = data.ledger.filter(x => x.type === '수입').reduce((a,x) => a + Number(x.amount), 0);
  const expense = data.ledger.filter(x => x.type === '지출').reduce((a,x) => a + Number(x.amount), 0);
  const recent = [...data.ledger].sort((a,b) => b.date.localeCompare(a.date)).slice(0,5);

  return `
    <div class="hero rounded-2xl p-6 sm:p-8 mb-5">
      <div class="relative z-10 max-w-3xl">
        <div class="text-xs gold font-bold tracking-widest mb-3">● GOLD MOON ORGANIZATION PORTAL</div>
        <h1 class="text-2xl sm:text-3xl font-extrabold mb-3">골드문 조직 관리 포털</h1>
        <p class="text-sm sm:text-base" style="color:#d1cbd0">골드문 공동 업무 포털 — 조직원, 직급, 수입·지출, 품목 및 대출 내역을 관리합니다.</p>
        <div class="flex gap-2 mt-6">
          <button class="gold-btn rounded-lg px-4 py-2 text-sm" data-go="ledger">장부 관리</button>
          <button class="outline-btn rounded-lg px-4 py-2 text-sm" data-go="members">조직원 관리</button>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
      <div class="panel p-5"><p class="muted text-sm">총 조직원</p><div class="stat-number mt-3">${data.members.filter(m => m.status !== '퇴장').length}<span class="text-base ml-1">명</span></div><p class="muted text-xs mt-2">현재 활동 중인 조직원</p></div>
      <div class="panel p-5"><p class="muted text-sm">누적 총수입</p><div class="stat-number gold mt-3">${won(income)}</div><p class="muted text-xs mt-2">장부 수입 합계</p></div>
      <div class="panel p-5"><p class="muted text-sm">순자산</p><div class="stat-number mt-3">${won(income-expense)}</div><p class="muted text-xs mt-2">총 지출 ${won(expense)} 반영</p></div>
    </div>

    <div class="panel">
      <div class="p-5 border-b" style="border-color:var(--line)"><h3 class="font-bold">최근 거래내역</h3><p class="muted text-xs mt-1">장부에 등록된 최신 5건</p></div>
      ${recent.length
        ? tableHTML(['날짜','구분','내용','금액','작성자'], recent.map(x => [
            esc(x.date), `<span class="badge">${esc(x.type)}</span>`, esc(x.title),
            `<span class="${x.type === '수입' ? 'gold' : ''}">${won(x.amount)}</span>`, esc(x.author || '관리자')
          ]))
        : empty('등록된 거래가 없습니다. 장부를 작성해 주세요.')}
    </div>`;
}

function tableHTML(headers, rows) {
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function membersView() {
  const active = data.members.filter(m => m.status !== '퇴장');

  return sectionHead('조직원 관리','조직원 등록, 직급 배정 및 퇴장 처리를 관리합니다.',`<button class="gold-btn rounded-lg px-4 py-2 text-sm" id="addMember">＋ 조직원 추가</button>`)
    + `<div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-5">
      <div class="panel p-4"><div class="muted text-xs">활동 조직원</div><div class="text-2xl font-bold mt-2">${active.length}명</div></div>
      <div class="panel p-4"><div class="muted text-xs">등록된 전체 인원</div><div class="text-2xl font-bold mt-2">${data.members.length}명</div></div>
      <div class="panel p-4"><div class="muted text-xs">직급 종류</div><div class="text-2xl font-bold mt-2">${data.ranks.length}개</div></div>
    </div>
    <div class="panel">${active.length
      ? tableHTML(['이름 / 게임 ID','직급','가입일','메모','관리'], active.map(m => [

function transactionsView() {

      <div class="panel p-4"><p class="muted text-xs">미상환 금액</p><p class="text-2xl font-bold gold mt-2">${won(balance)}</p></div>
    </div>
    <div class="panel">${data.loans.length
      ? tableHTML(['대출자','대출일','원금','상환액','잔액','상태','관리'], data.loans.map(x => [
          esc(x.person), esc(x.date), won(x.amount), won(x.paid||0),

          `<button class="outline-btn rounded px-2 py-1 text-xs" data-pay-loan="${x.id}">상환 기록</button> <button class="outline-btn danger rounded px-2 py-1 text-xs" data-delete-loan="${x.id}">삭제</button>`
        ]))
      : empty('등록된 대출 내역이 없습니다.')}

function openModal(title, body) {
  $('#modalRoot').innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div class="flex justify-between items-center mb-5"><h3 class="text-lg font-bold">${title}</h3><button id="closeModal" class="outline-btn rounded-lg px-3 py-1">✕</button></div>${body}</div></div>`;
  $('#closeModal').onclick = closeModal;
  $('#modalBackdrop').onclick = event => {
    if (event.target.id === 'modalBackdrop') closeModal();
  };
}

function closeModal() {
  $('#modalRoot').innerHTML = '';
}

function memberForm(member = {}) {
  openModal(member.id ? '조직원 수정' : '조직원 추가', `
    <form id="memberForm" class="space-y-3">
      <div><label class="label">이름 *</label><input class="field" name="name" value="${esc(member.name||'')}" required maxlength="40"></div>
      <div><label class="label">FiveM 게임 ID</label><input class="field" name="gameId" value="${esc(member.gameId||'')}" maxlength="80" placeholder="서버 ID 또는 식별자"></div>
      <div><label class="label">직급</label><select class="field" name="rank">${data.ranks.map(rank => `<option ${rank === (member.rank || data.ranks[data.ranks.length-1]) ? 'selected' : ''}>${esc(rank)}</option>`).join('')}</select></div>
      <div><label class="label">가입일</label><input class="field" name="joined" type="date" value="${esc(member.joined||dateNow())}"></div>
      <div><label class="label">메모</label><input class="field" name="note" value="${esc(member.note||'')}" maxlength="160" placeholder="선택 입력"></div>
      <button class="gold-btn rounded-lg px-4 py-2 w-full">${member.id?'수정 저장':'조직원 등록'}</button>
    </form>
  `);

  $('#memberForm').onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(event.target).entries());

    if (member.id) Object.assign(data.members.find(x => x.id === member.id), values);
    else data.members.push({...values,id:crypto.randomUUID(),status:'활동'});

    save();
    closeModal();
    render();
    toast(member.id ? '조직원 정보를 수정했습니다.' : '조직원을 등록했습니다.');
  };
}

function openLedgerModal() {
  openModal('장부 작성', `
    <form id="ledgerForm" class="space-y-3">
      <div><label class="label">구분 *</label><select class="field" name="type"><option>수입</option><option>지출</option></select></div>
      <div><label class="label">내용 *</label><input class="field" name="title" required maxlength="100" placeholder="예: 조직 활동 수익"></div>
      <div><label class="label">금액 (원) *</label><input class="field" name="amount" type="number" min="1" step="1" required placeholder="0"></div>
      <div><label class="label">날짜</label><input class="field" name="date" type="date" value="${dateNow()}" required></div>
      <div><label class="label">메모</label><textarea class="field" name="memo" rows="2" maxlength="300"></textarea></div>
      <button class="gold-btn rounded-lg px-4 py-2 w-full">장부 저장</button>
    </form>
  `);

  $('#ledgerForm').onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(event.target));
    values.amount = Number(values.amount);
    values.id = crypto.randomUUID();
    values.author = data.admin.name || '관리자';
    data.ledger.push(values);
    save();
    closeModal();
    render();
    toast('장부 내역을 저장했습니다.');
  };
}

function itemForm(item = {}) {
  const categories = [...new Set([...(data.categories || ['일반']),item.category || '일반'])];

  openModal(item.id ? '품목 수정' : '품목 등록', `
    <form id="itemForm" class="space-y-3">
      <div><label class="label">품목명 *</label><input class="field" name="name" required value="${esc(item.name||'')}"></div>
      <div>
        <label class="label">분류</label>
        <select class="field" name="category">${categories.map(category => `<option value="${esc(category)}" ${category === (item.category || '일반') ? 'selected' : ''}>${esc(category)}</option>`).join('')}</select>
        <p class="muted text-xs mt-1">새 분류는 왼쪽의 카테고리 관리에서 추가할 수 있습니다.</p>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="label">수량 *</label><input class="field" name="qty" type="number" min="0" required value="${esc(item.qty ?? 1)}"></div>
        <div><label class="label">단가 (원)</label><input class="field" name="price" type="number" min="0" value="${esc(item.price ?? 0)}"></div>
      </div>
      <div><label class="label">메모</label><input class="field" name="note" value="${esc(item.note||'')}"></div>
      <button class="gold-btn rounded-lg px-4 py-2 w-full">저장</button>
    </form>
  `);

  $('#itemForm').onsubmit = event => {
    event.preventDefault();
    const values = Object.fromEntries(new FormData(event.target));
    values.qty = Number(values.qty);
    values.price = Number(values.price || 0);

    if (item.id) Object.assign(data.items.find(x => x.id === item.id), values);
    else data.items.push({...values,id:crypto.randomUUID()});

    if (values.category && !data.categories.includes(values.category)) {
      data.categories.push(values.category);
    }

    save();
    closeModal();
    render();
    toast('품목 정보를 저장했습니다.');
  };

function bindPage() {
  $('#content').querySelectorAll('[data-go]').forEach(button => {
    button.onclick = () => go(button.dataset.go);
  });

  const addMember = $('#addMember');
  if (addMember) addMember.onclick = () => memberForm();

  $$('[data-edit-member]').forEach(button => {
    button.onclick = () => memberForm(data.members.find(m => m.id === button.dataset.editMember));
  });

  $$('[data-remove-member]').forEach(button => {
    button.onclick = () => {
      const member = data.members.find(m => m.id === button.dataset.removeMember);
      if (confirm(`${member.name} 조직원을 퇴장 처리할까요? 기록은 보존됩니다.`)) {
        member.status = '퇴장';
        member.left = dateNow();
        save();
        render();
        toast('퇴장 처리했습니다.');
      }
    };
  });

  const addRank = $('#addRank');
  if (addRank) {
    addRank.onclick = () => {
      openModal('직급 추가', `<form id="rankForm"><label class="label">직급명</label><input class="field mb-4" name="rank" required maxlength="30"><button class="gold-btn rounded-lg px-4 py-2 w-full">직급 추가</button></form>`);
      $('#rankForm').onsubmit = event => {
        event.preventDefault();
        const rank = new FormData(event.target).get('rank').trim();
        if (data.ranks.includes(rank)) {
          toast('이미 존재하는 직급입니다.');
          return;
        }
        data.ranks.push(rank);
        save();
        closeModal();
        render();
      };
    };
  }

  $$('[data-rank-up]').forEach(button => button.onclick = () => {
    const i = Number(button.dataset.rankUp);
    [data.ranks[i-1],data.ranks[i]] = [data.ranks[i],data.ranks[i-1]];
    save(); render();
  });

  $$('[data-rank-down]').forEach(button => button.onclick = () => {
    const i = Number(button.dataset.rankDown);
    [data.ranks[i+1],data.ranks[i]] = [data.ranks[i],data.ranks[i+1]];
    save(); render();
  });

  $$('[data-rank-del]').forEach(button => button.onclick = () => {
    const i = Number(button.dataset.rankDel);
    const rank = data.ranks[i];

    if (confirm(`'${rank}' 직급을 삭제할까요?`)) {
      data.ranks.splice(i,1);
      data.members.forEach(member => {
        if (member.rank === rank) member.rank = data.ranks[data.ranks.length-1];
      });
      save(); render();
    }
  });

  const addLedger = $('#addLedger');
  if (addLedger) addLedger.onclick = openLedgerModal;

  $$('[data-delete-ledger]').forEach(button => button.onclick = () => {
    if (confirm('이 장부 기록을 삭제할까요?')) {
      data.ledger = data.ledger.filter(x => x.id !== button.dataset.deleteLedger);
      save(); render(); toast('장부 기록을 삭제했습니다.');
    }
  });

  const addItem = $('#addItem');
  if (addItem) addItem.onclick = () => itemForm();

  $$('[data-edit-item]').forEach(button => {
    button.onclick = () => itemForm(data.items.find(x => x.id === button.dataset.editItem));
  });

  $$('[data-delete-item]').forEach(button => button.onclick = () => {
    if (confirm('이 품목을 삭제할까요?')) {
      data.items = data.items.filter(x => x.id !== button.dataset.deleteItem);
      save(); render();
    }
  });

  const addCategory = $('#addCategory');
  if (addCategory) {
    addCategory.onclick = () => {
      openModal('카테고리 추가', `
        <form id="categoryForm" class="space-y-3">
          <div><label class="label">카테고리명 *</label><input class="field" name="name" required maxlength="40" placeholder="예: 무기, 차량, 소모품"></div>
          <button class="gold-btn rounded-lg px-4 py-2 w-full">카테고리 추가</button>
        </form>
      `);

      $('#categoryForm').onsubmit = event => {
        event.preventDefault();
        const name = new FormData(event.target).get('name').trim();

        if (!name) {
          toast('카테고리명을 입력해 주세요.');
          return;
        }

        if (data.categories.some(category => category.toLowerCase() === name.toLowerCase())) {
          toast('이미 존재하는 카테고리입니다.');
          return;
        }

        data.categories.push(name);
        save();
        closeModal();
        render();
        toast('카테고리를 추가했습니다.');
      };
    }
  }

  $$('[data-category-delete]').forEach(button => button.onclick = () => {
    const index = Number(button.dataset.categoryDelete);
    const name = data.categories[index];

    if (data.items.some(item => (item.category || '일반').trim() === name)) {
      toast('사용 중인 카테고리는 삭제할 수 없습니다.');
      return;
    }

    if (confirm(`'${name}' 카테고리를 삭제할까요?`)) {
      data.categories.splice(index,1);
      if (!data.categories.length) data.categories.push('일반');
      save();
      render();
      toast('카테고리를 삭제했습니다.');
    }
  });

  const search = $('#transactionSearch');
  if (search) {
    search.oninput = () => {
      const query = search.value.toLowerCase();
      const filtered = data.ledger.filter(x =>
        [x.date,x.type,x.title,x.author,x.memo].join(' ').toLowerCase().includes(query)
      );
      $('#transactionTable').innerHTML = filtered.length ? transactionTable(filtered) : empty('검색 결과가 없습니다.');
    };
  }

  const exportButton = $('#exportCsv');
  if (exportButton) {
    exportButton.onclick = () => {
      const rows = [['날짜','구분','내용','금액','작성자','메모'], ...data.ledger.map(x => [
        x.date,x.type,x.title,x.amount,x.author || '관리자',x.memo || ''
      ])];
      const csv = '\ufeff' + rows.map(row => row.map(value => `"${String(value).replace(/"/g,'""')}"`).join(',')).join('\r\n');
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
      link.download = 'goldmoon_transactions.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    };
  }

  const addLoan = $('#addLoan');
  if (addLoan) {
    addLoan.onclick = () => {
      openModal('대출 등록', `
        <form id="loanForm" class="space-y-3">
          <div><label class="label">대출자 *</label><input class="field" name="person" required></div>
          <div><label class="label">대출일</label><input class="field" name="date" type="date" value="${dateNow()}" required></div>
          <div><label class="label">대출 원금 (원) *</label><input class="field" name="amount" type="number" min="1" required></div>
          <button class="gold-btn rounded-lg px-4 py-2 w-full">대출 등록</button>
        </form>
      `);

      $('#loanForm').onsubmit = event => {
        event.preventDefault();
        const values = Object.fromEntries(new FormData(event.target));
        values.amount = Number(values.amount);
        values.paid = 0;
        values.status = '상환 중';
        values.id = crypto.randomUUID();
        data.loans.push(values);
        save(); closeModal(); render(); toast('대출 내역을 등록했습니다.');
      };
    };
  }

  $$('[data-pay-loan]').forEach(button => button.onclick = () => {
    const loan = data.loans.find(x => x.id === button.dataset.payLoan);
    const remaining = Math.max(0,loan.amount-loan.paid);

    openModal('상환 기록', `
      <p class="muted text-sm mb-4">남은 상환액: <b class="gold">${won(remaining)}</b></p>
      <form id="payForm" class="space-y-3">
        <div><label class="label">이번 상환액 (원)</label><input class="field" name="paid" type="number" min="1" max="${remaining}" required></div>
        <button class="gold-btn rounded-lg px-4 py-2 w-full">상환 저장</button>
      </form>
    `);

    $('#payForm').onsubmit = event => {
      event.preventDefault();
      const amount = Number(new FormData(event.target).get('paid'));
      if (amount > remaining) return;
      loan.paid += amount;
      if (loan.paid >= loan.amount) loan.status = '상환 완료';
      save(); closeModal(); render(); toast('상환 내역을 저장했습니다.');
    };
  });

  $$('[data-delete-loan]').forEach(button => button.onclick = () => {
    if (confirm('대출 내역을 삭제할까요?')) {
      data.loans = data.loans.filter(x => x.id !== button.dataset.deleteLoan);
      save(); render();
    }
  });
}

function bindGlobal() {
  $('#modalRoot').addEventListener('submit', async event => {
    if (event.target.id === 'passwordForm') {
      event.preventDefault();
      const form = new FormData(event.target);
      const oldPassword = form.get('old');
      const newPassword = form.get('newp');
      const confirmPassword = form.get('confirm');

      if (newPassword !== confirmPassword) {
        toast('새 비밀번호가 일치하지 않습니다.');
        return;
      }
      if (newPassword.length < 12) {
        toast('새 비밀번호는 12자 이상이어야 합니다.');
        return;
      }

      try {
        await api('/api/password', {
          method:'POST',
          body:JSON.stringify({currentPassword:oldPassword,newPassword})
        });
        closeModal();
        toast('비밀번호를 변경했습니다.');
      } catch (error) {
        toast(error.message || '비밀번호를 변경하지 못했습니다.');
      }
    }
  });
}

$('#content').addEventListener('submit', async event => {
  if (event.target.id === 'viewerCreateForm') {
    event.preventDefault();
    const form = new FormData(event.target);

    try {
      await api('/api/viewer-accounts', {
        method:'POST',
        body:JSON.stringify({
          username:form.get('username').trim(),
          displayName:form.get('displayName').trim(),
          password:form.get('password')
        })
      });
      event.target.reset();
      toast('조회 계정을 생성했습니다.');
      loadViewerList();
    } catch (error) {
      toast(error.message || '계정 생성에 실패했습니다.');
    }
  }
});

$('#content').addEventListener('click', async event => {
  const button = event.target.closest('[data-delete-viewer]');
  if (!button) return;
  if (!confirm('이 조회 계정을 삭제할까요?')) return;

  try {
    await api('/api/viewer-accounts/' + encodeURIComponent(button.dataset.deleteViewer), {
      method:'DELETE'
    });
    toast('조회 계정을 삭제했습니다.');
    loadViewerList();
  } catch (error) {
    toast(error.message || '계정 삭제에 실패했습니다.');
  }
});

bindGlobal();

api('/api/me').then(async result => {
  if (result.authenticated) await showApp();
}).catch(() => {});
</script>
</body>
</html>
